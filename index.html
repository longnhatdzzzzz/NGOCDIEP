<body>

<div class="container">

<input id="keyinput" placeholder="Nhập key">

<script>

/* KEY SYSTEM */

function enterTool(){

let key=document.getElementById("keyinput").value.trim();
let expire=null;

if(key==="LNHATVIP01"){expire=86400000;}
else if(key==="THINGAY"){expire=3600000;}
else if(key==="KOCHO"){expire="infinite";}
else{alert("Key sai");return;}

if(expire==="infinite"){

localStorage.setItem("toolExpire","infinite");

}else{

let end=Date.now()+expire;
localStorage.setItem("toolExpire",end);

}

document.getElementById("keyscreen").style.display="none";
document.getElementById("tool").style.display="block";

startTimer();

}

/* TIMER */

function startTimer(){

let expire=localStorage.getItem("toolExpire");

if(expire==="infinite"){

document.getElementById("time").innerHTML="∞ VĨNH VIỄN";
return;

}

setInterval(function(){

let remain=expire-Date.now();

if(remain<=0){

alert("Key hết hạn");
localStorage.removeItem("toolExpire");
location.reload();

}

let h=Math.floor(remain/3600000);
let m=Math.floor((remain%3600000)/60000);
let s=Math.floor((remain%60000)/1000);

document.getElementById("time").innerHTML=
h+":"+(m<10?"0"+m:m)+":"+(s<10?"0"+s:s);

},1000);

}

/* DATABASE */

let data = {

},

"8521049323":{

},

}

};

/* LOGIN */

function login(){

let id=document.getElementById("idgame").value.trim();
let bar=document.getElementById("bar");
let progress=document.querySelector(".progress");

progress.style.display="block";
bar.style.width="0%";

let percent=0;

let load=setInterval(function(){

percent+=10;
bar.style.width=percent+"%";

if(percent>=100){

clearInterval(load);
progress.style.display="none";

showPlayer();

}

},120);

function showPlayer(){

if(data[id]){

let p=data[id];

document.getElementById("name").innerHTML=`
<div class="playerBox">
<img src="${p.avatar}">
<br>
UID: ${id}<br>
Tên: ${p.name}<br>
Level: ${p.level}
</div>
`;

}else{

document.getElementById("name").innerHTML="Không tìm thấy ID";

}

}

}

/* CONSOLE */

function log(t){
let box=document.getElementById("console");
box.innerHTML+=t+"<br>";
box.scrollTop=box.scrollHeight;
}

/* CHECK MAIL */

function checkMail(){

let logs=[
"[+] Connecting server...",
"[+] Checking mail verify...",
"[+] Mail tiens12sss@gmail.com",

"[+] Pass Account: 090912"
];

setTimeout(()=>log(l),i*300);
});

}

function spamLogin(){
["[SYSTEM] Sending packets...","[SYSTEM] Spam done"].forEach((l,i)=>setTimeout(()=>log(l),i*300));
}

["[SYSTEM] Removing old mail...","[SYSTEM] Setting new mail"].forEach((l,i)=>setTimeout(()=>log(l),i*300));

function bandAccount(){
["[SYSTEM] Applying punishment...","[SYSTEM] Account banned 15 days"].forEach((l,i)=>setTimeout(()=>log(l),i*300));
}

/* MATRIX */

let matrix=document.getElementById("matrix");
let ctx=matrix.getContext("2d");

matrix.width=window.innerWidth;
matrix.height=window.innerHeight;

let letters="01アイウエオカキクケコ".split("");
let font=14;
let columns=matrix.width/font;
let drops=[];

for(let x=0;x<columns;x++) drops[x]=1;

function drawMatrix(){

ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,matrix.width,matrix.height);

ctx.fillStyle="#0f0";
ctx.font=font+"px monospace";

for(let i=0;i<drops.length;i++){

let text=letters[Math.floor(Math.random()*letters.length)];
ctx.fillText(text,i*font,drops[i]*font);

if(drops[i]*font>matrix.height && Math.random()>0.975)
drops[i]=0;

drops[i]++;

}

}

setInterval(drawMatrix,33);

/* STARS */

let starCanvas=document.getElementById("stars");
let starCtx=starCanvas.getContext("2d");

starCanvas.width=window.innerWidth;
starCanvas.height=window.innerHeight;

let stars=[];

for(let i=0;i<120;i++){
stars.push({x:Math.random()*starCanvas.width,y:Math.random()*starCanvas.height,size:Math.random()*2});
}

function drawStars(){

starCtx.clearRect(0,0,starCanvas.width,starCanvas.height);
starCtx.fillStyle="white";

stars.forEach(s=>{
starCtx.beginPath();
starCtx.arc(s.x,s.y,s.size,0,Math.PI*2);
starCtx.fill();
s.y+=0.2;
if(s.y>starCanvas.height){s.y=0;s.x=Math.random()*starCanvas.width;}
});

requestAnimationFrame(drawStars);

}

drawStars();

/* SAKURA */

let sakuraCanvas=document.getElementById("sakura");
let sakuraCtx=sakuraCanvas.getContext("2d");

sakuraCanvas.width=window.innerWidth;
sakuraCanvas.height=window.innerHeight;

let petals=[];

for(let i=0;i<30;i++){
petals.push({x:Math.random()*sakuraCanvas.width,y:Math.random()*sakuraCanvas.height,size:Math.random()*6+4,speed:Math.random()*1+0.5});
}

function drawPetals(){

sakuraCtx.clearRect(0,0,sakuraCanvas.width,sakuraCanvas.height);
sakuraCtx.fillStyle="pink";

petals.forEach(p=>{
sakuraCtx.beginPath();
sakuraCtx.arc(p.x,p.y,p.size,0,Math.PI*2);
sakuraCtx.fill();
p.y+=p.speed;
p.x+=Math.sin(p.y*0.01);
if(p.y>sakuraCanvas.height){p.y=0;p.x=Math.random()*sakuraCanvas.width;}
});

requestAnimationFrame(drawPetals);

}

drawPetals();

</script>
